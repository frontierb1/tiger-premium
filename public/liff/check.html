<!DOCTYPE html>
<html lang="th" data-page="เช็ควันหมดอายุ">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>เช็ควันหมดอายุ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/liff/theme.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff/config.js"></script>
  <script src="/liff/liff-auth.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="index.html" class="icon-btn" data-icon="back" aria-label="ย้อนกลับ"></a>
    <h1>เช็ควันหมดอายุ</h1>
  </header>

  <div id="loading" class="center-state">
    <div class="spinner"></div>
    <p>กำลังโหลดข้อมูล…</p>
  </div>

  <div id="empty" class="center-state hidden">
    <div class="cs-icon" data-icon="search"></div>
    <h2>ไม่พบข้อมูลสมาชิก</h2>
    <p>กรุณา <a href="register.html" class="link">สมัครสมาชิก</a> ก่อนนะครับ</p>
  </div>

  <main id="main" class="hidden"></main>
</div>

<script>
  const BASE_URL = window.location.origin;
  const tone = d => d > 7 ? 'ok' : d > 0 ? 'warn' : 'danger';

  async function init() {
    await liff.init({ liffId: APP.liffId });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();

    const res = await apiFetch(`${BASE_URL}/api/members/${profile.userId}`);
    const data = await res.json();
    document.getElementById('loading').classList.add('hidden');

    const members = (data.members || [])
      .filter(m => m.inviteStatus !== 'removed')
      .sort((a, b) => a.daysLeft - b.daysLeft);

    if (!data.found || !members.length) {
      document.getElementById('empty').classList.remove('hidden');
      return;
    }

    const main = document.getElementById('main');
    main.classList.remove('hidden');
    main.innerHTML = members.map((m, i) => {
      const d = m.daysLeft;
      const t = tone(d);
      const statusText = t === 'ok' ? 'ใช้งานได้ปกติ' : t === 'warn' ? 'ใกล้หมดอายุ' : 'หมดอายุแล้ว';

      return `
        <section class="section fade-in" ${i === 0 ? 'style="margin-top:16px"' : ''}>
          <div class="card">
            <div class="hero ${t}">
              <div class="hero-days">${d > 0 ? d : 0}</div>
              <div class="hero-unit">${d > 0 ? 'วันที่เหลือ' : 'หมดอายุแล้ว'}</div>
              <div style="margin-top:12px">
                <span class="badge ${t}">${t === 'ok' ? ICON.check : ICON.alert}<span>${statusText}</span></span>
              </div>
            </div>
            <div style="border-top:1px solid var(--border)">
              <div class="row">
                <div class="row-main"><div class="row-sub">อีเมล</div></div>
                <div class="row-title" style="text-align:right">${m.houseEmail || '—'}</div>
              </div>
              <div class="row">
                <div class="row-main"><div class="row-sub">แพ็กเกจ</div></div>
                <div class="row-title">${APP.pkgLabel(m.package)}</div>
              </div>
              <div class="row">
                <div class="row-main"><div class="row-sub">วันหมดอายุ</div></div>
                <div class="row-title">${m.expireDate}</div>
              </div>
            </div>
          </div>
          ${d <= 7 ? `<a href="renew.html" class="btn btn-primary" style="margin-top:10px">${ICON.refresh}<span>ต่ออายุอีเมลนี้</span></a>` : ''}
        </section>`;
    }).join('');
  }

  init().catch(console.error);
</script>
</body>
</html>
