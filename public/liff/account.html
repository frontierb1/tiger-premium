<!DOCTYPE html>
<html lang="th" data-page="ข้อมูลของฉัน">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ข้อมูลของฉัน</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/liff/theme.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff/config.js"></script>
  <script src="/liff/liff-auth.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a href="index.html" class="icon-btn" data-icon="back" aria-label="ย้อนกลับ"></a>
    <h1>ข้อมูลของฉัน</h1>
  </header>

  <div id="loading" class="center-state pull-up">
    <div class="spinner"></div>
    <p>กำลังโหลดข้อมูล…</p>
  </div>

  <div id="empty" class="center-state pull-up hidden">
    <div class="cs-icon" data-icon="search"></div>
    <h2>ไม่พบข้อมูลสมาชิก</h2>
    <p>กรุณา <a href="register.html" class="link">สมัครสมาชิก</a> ก่อนนะครับ</p>
  </div>

  <main id="main" class="hidden">
    <div class="section pull-up">
      <div class="section-label" id="count-label"></div>
      <div class="stack-lg" id="list"></div>
    </div>
  </main>
</div>

<script>
  const BASE_URL = window.location.origin;
  const tone = d => d > 7 ? 'ok' : d > 0 ? 'warn' : 'danger';

  const INVITE_LABEL = {
    pending:  { text: 'รอแอดมินส่งคำเชิญ', cls: 'info' },
    inviting: { text: 'รอคุณกดรับคำเชิญ',  cls: 'warn' },
    active:   { text: 'เข้าร่วมแล้ว',       cls: 'ok' },
  };

  async function init() {
    await liff.init({ liffId: APP.liffId });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();

    const res = await apiFetch(`${BASE_URL}/api/members/${profile.userId}`);
    const data = await res.json();
    document.getElementById('loading').classList.add('hidden');

    const members = (data.members || [])
      .filter(m => m.inviteStatus !== 'removed')
      .sort((a, b) => a.daysLeft - b.daysLeft);

    if (!data.found || !members.length) {
      document.getElementById('empty').classList.remove('hidden');
      return;
    }

    document.getElementById('main').classList.remove('hidden');
    document.getElementById('count-label').textContent =
      members.length > 1 ? `สมาชิกทั้งหมด ${members.length} รายการ` : 'สมาชิกของคุณ';

    document.getElementById('list').innerHTML = members.map(m => {
      const d = m.daysLeft;
      const t = tone(d);
      const invite = INVITE_LABEL[m.inviteStatus] || { text: m.inviteStatus || '—', cls: 'muted' };

      return `
        <div class="fade-in">
          <div class="card">
            <div class="row" style="padding:16px">
              <div class="row-main">
                <div class="row-title" style="font-size:15px">${m.houseEmail || '—'}</div>
                <div class="row-sub">${APP.pkgLabel(m.package)}</div>
              </div>
              <span class="badge ${t}">${d > 0 ? `${d} วัน` : 'หมดอายุ'}</span>
            </div>
            <div style="border-top:1px solid var(--border)">
              <div class="row">
                <div class="row-main"><div class="row-sub">วันหมดอายุ</div></div>
                <div class="row-title">${m.expireDate}</div>
              </div>
              <div class="row">
                <div class="row-main"><div class="row-sub">สถานะคำเชิญ</div></div>
                <span class="badge ${invite.cls}">${invite.text}</span>
              </div>
              ${m.registeredAt ? `
              <div class="row">
                <div class="row-main"><div class="row-sub">สมัครเมื่อ</div></div>
                <div class="row-title">${String(m.registeredAt).slice(0, 10)}</div>
              </div>` : ''}
            </div>
          </div>
          ${d <= 7 ? `<a href="renew.html" class="btn btn-primary" style="margin-top:10px">${ICON.refresh}<span>ต่ออายุอีเมลนี้</span></a>` : ''}
        </div>`;
    }).join('');
  }

  init().catch(console.error);
</script>
</body>
</html>
