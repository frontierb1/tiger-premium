<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>หน้าหลัก</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/liff/theme.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/liff/config.js"></script>
  <script src="/liff/liff-auth.js"></script>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="brand" data-brand></div>
    <h1>สมาชิกของคุณ</h1>
    <p data-tagline></p>
  </header>

  <!-- การ์ดสถานะหลัก -->
  <div class="section" style="margin-top:4px">
    <div class="card">
      <div class="hero idle" id="hero">
        <div class="skel" style="height:44px;width:120px;margin:6px auto"></div>
        <div class="skel" style="height:13px;width:180px;margin:14px auto 0"></div>
      </div>
      <div id="hero-foot" class="hidden" style="border-top:1px solid var(--border);padding:12px 18px;text-align:center">
        <span class="badge muted" id="hero-badge"></span>
      </div>
    </div>

    <!-- รายการอีเมลเพิ่มเติม (เมื่อมีหลายอัน) -->
    <div id="more-wrap" class="hidden" style="margin-top:8px">
      <button class="option" id="more-toggle" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 15px">
        <span style="font-size:13px;font-weight:600" id="more-label"></span>
        <span class="n-chevron" data-icon="chevron" id="more-chevron" style="display:flex"></span>
      </button>
      <div class="stack hidden" id="more-list" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- งานที่ต้องรอ / ต้องทำ -->
  <div class="section hidden" id="notices-section">
    <div class="section-label">สิ่งที่กำลังดำเนินการ</div>
    <div class="stack" id="notices"></div>
  </div>

  <!-- เมนู -->
  <nav class="section">
    <div class="section-label">เมนู</div>
    <div class="menu">
      <a href="register.html" class="menu-item">
        <span class="m-icon" data-icon="plus"></span>
        <span class="m-title">สมัครสมาชิก</span>
        <span class="m-sub">เริ่มใช้งานได้เลย</span>
      </a>
      <a href="check.html" class="menu-item">
        <span class="m-icon" data-icon="calendar"></span>
        <span class="m-title">เช็ควันหมดอายุ</span>
        <span class="m-sub">ดูสถานะของคุณ</span>
      </a>
      <a href="renew.html" class="menu-item">
        <span class="m-icon" data-icon="refresh"></span>
        <span class="m-title">ต่ออายุ</span>
        <span class="m-sub">แนบสลิปยืนยัน</span>
      </a>
      <a href="report.html" class="menu-item">
        <span class="m-icon" data-icon="help"></span>
        <span class="m-title">แจ้งปัญหา</span>
        <span class="m-sub">ใช้งานไม่ได้?</span>
      </a>
    </div>
  </nav>

</div>

<script>
  const BASE_URL = window.location.origin;
  let _profile = null;
  let _moreOpen = false;
  const _noticeOpen = new Map();

  async function init() {
    await liff.init({ liffId: APP.liffId });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    _profile = await liff.getProfile();

    document.getElementById('more-toggle').onclick = () => {
      _moreOpen = !_moreOpen;
      document.getElementById('more-list').classList.toggle('hidden', !_moreOpen);
      document.getElementById('more-chevron').classList.toggle('open', _moreOpen);
    };

    await loadData();
    setInterval(loadData, 30000); // อัปเดตทุก 30 วิ
  }

  async function loadData() {
    try {
      const [memberRes, reportRes] = await Promise.all([
        apiFetch(`${BASE_URL}/api/members/${_profile.userId}`),
        apiFetch(`${BASE_URL}/api/admin/report/user/${_profile.userId}`).catch(() => null),
      ]);
      const memberData = await memberRes.json();
      const reportData = reportRes ? await reportRes.json().catch(() => null) : null;

      renderHero(memberData);
      renderNotices(memberData, reportData);
    } catch (err) {
      console.error('loadData error:', err);
    }
  }

  /** แปลงจำนวนวันคงเหลือเป็นระดับสถานะ */
  function tone(days) {
    return days > 7 ? 'ok' : days > 0 ? 'warn' : 'danger';
  }

  function renderHero(memberData) {
    const members = (memberData?.members || [])
      .filter(m => m.inviteStatus !== 'removed')
      .sort((a, b) => a.daysLeft - b.daysLeft);

    const hero = document.getElementById('hero');
    const foot = document.getElementById('hero-foot');
    const badge = document.getElementById('hero-badge');
    const moreWrap = document.getElementById('more-wrap');

    if (members.length === 0) {
      hero.className = 'hero idle fade-in';
      hero.innerHTML = `
        <div class="hero-days">ยังไม่มีสมาชิก</div>
        <div class="hero-unit">กดสมัครสมาชิกด้านล่างได้เลยครับ</div>`;
      foot.classList.add('hidden');
      moreWrap.classList.add('hidden');
      return;
    }

    const first = members[0];
    const d = first.daysLeft;
    const t = tone(d);

    hero.className = `hero ${t} fade-in`;
    hero.innerHTML = `
      <div class="hero-days">${d > 0 ? d : 0}</div>
      <div class="hero-unit">${d > 0 ? 'วันที่เหลือ' : 'หมดอายุแล้ว'}</div>
      <div class="hero-email">${ICON.mail}<span>${first.houseEmail || '—'}</span></div>`;

    foot.classList.remove('hidden');
    badge.className = `badge ${t}`;
    badge.innerHTML = `${t === 'ok' ? ICON.check : ICON.alert}<span>${
      t === 'ok' ? `ใช้งานได้ถึง ${first.expireDate}`
      : t === 'warn' ? `ใกล้หมดอายุ ${first.expireDate}`
      : `หมดอายุเมื่อ ${first.expireDate}`}</span>`;

    // อีเมลเพิ่มเติม
    if (members.length > 1) {
      moreWrap.classList.remove('hidden');
      document.getElementById('more-label').textContent = `อีเมลทั้งหมด ${members.length} รายการ`;
      document.getElementById('more-list').innerHTML = members.slice(1).map(m => {
        const mt = tone(m.daysLeft);
        return `
          <div class="card">
            <div class="row">
              <div class="row-main">
                <div class="row-title">${m.houseEmail || '—'}</div>
                <div class="row-sub">หมดอายุ ${m.expireDate}</div>
              </div>
              <span class="badge ${mt}">${m.daysLeft > 0 ? `${m.daysLeft} วัน` : 'หมดอายุ'}</span>
            </div>
          </div>`;
      }).join('');
      document.getElementById('more-list').classList.toggle('hidden', !_moreOpen);
      document.getElementById('more-chevron').classList.toggle('open', _moreOpen);
    } else {
      moreWrap.classList.add('hidden');
    }
  }

  const INVITE_STEPS = (email) => `
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body"><strong>เปิดอีเมล ${email || 'ของคุณ'}</strong>ค้นหาอีเมลจาก YouTube หรือ Google Family</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body"><strong>กด "ยอมรับคำเชิญ" (Accept invitation)</strong>ในอีเมลที่ได้รับจาก YouTube Premium Family</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-body"><strong>ล็อกอินด้วยอีเมลนี้บน YouTube</strong>เปิด youtube.com หรือแอป YouTube แล้วล็อกอิน</div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-body"><strong>แจ้งแอดมินว่ากดรับแล้ว</strong>กด "แจ้งปัญหา" หรือทักแชทหาแอดมินเพื่อยืนยัน</div>
      </div>
    </div>
    <div class="step-note">
      หากไม่พบอีเมล ให้ตรวจสอบในโฟลเดอร์ Spam / Junk<br>
      คำเชิญมีอายุ 7 วัน หากหมดอายุกรุณาแจ้งแอดมิน
    </div>`;

  function renderNotices(memberData, reportData) {
    const items = [];
    const members = (memberData?.members || []).filter(m => m.inviteStatus !== 'removed');

    members.forEach(m => {
      if (m.inviteStatus === 'pending') {
        items.push({
          tone: 'info', icon: 'clock',
          title: 'รอแอดมินดำเนินการ',
          sub: `${m.houseEmail || 'อีเมลของคุณ'} — รอส่งคำเชิญเข้า YouTube Premium`,
        });
      } else if (m.inviteStatus === 'inviting') {
        items.push({
          tone: 'ok', icon: 'mail',
          title: 'ส่งคำเชิญแล้ว — รอคุณกดรับ',
          sub: 'แตะเพื่อดูวิธีรับคำเชิญ',
          more: INVITE_STEPS(m.houseEmail),
        });
      }
    });

    (reportData?.reports || []).filter(r => r.status !== 'resolved').forEach(r => {
      items.push({
        tone: 'danger', icon: 'wrench',
        title: 'กำลังรอการแก้ไขจากแอดมิน',
        sub: r.detail || 'ปัญหาที่คุณแจ้งไว้ — ทีมงานกำลังดำเนินการ',
      });
    });

    const section = document.getElementById('notices-section');
    const wrap = document.getElementById('notices');

    if (items.length === 0) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');

    wrap.innerHTML = items.map((it, i) => `
      <div class="notice ${it.tone} ${it.more ? 'clickable' : ''} fade-in" ${it.more ? `onclick="toggleNotice(${i})"` : ''}>
        <span class="n-icon">${ICON[it.icon]}</span>
        <div class="n-body">
          <div class="n-title">${it.title}</div>
          <div class="n-sub">${it.sub}</div>
          ${it.more ? `<div class="n-more" id="n-more-${i}">${it.more}</div>` : ''}
        </div>
        ${it.more ? `<span class="n-chevron" id="n-chev-${i}">${ICON.chevron}</span>` : ''}
      </div>`).join('');

    // คืนสถานะเปิด/ปิดที่ผู้ใช้เลือกไว้ ไม่ให้หุบเองตอน refresh อัตโนมัติ
    items.forEach((it, i) => {
      if (it.more && _noticeOpen.get(i)) {
        document.getElementById(`n-more-${i}`)?.classList.add('open');
        document.getElementById(`n-chev-${i}`)?.classList.add('open');
      }
    });
  }

  function toggleNotice(i) {
    const more = document.getElementById(`n-more-${i}`);
    if (!more) return;
    const open = !more.classList.contains('open');
    more.classList.toggle('open', open);
    document.getElementById(`n-chev-${i}`)?.classList.toggle('open', open);
    _noticeOpen.set(i, open);
  }

  init().catch(console.error);
</script>
</body>
</html>
